[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horticulture-farm-plc"
version = "0.1.0"
description = "IEC 61131-3 greenhouse irrigation, fertigation and climate control: Structured Text PLC program, virtual plant, soft-PLC and web HMI over Modbus TCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pymodbus>=3.6"]

[project.scripts]
farmsim = "farmsim.__main__:main"

[tool.setuptools]
packages = ["farmsim"]

[tool.setuptools.package-data]
farmsim = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["slow: long simulations (a full day); run with --runslow"]
