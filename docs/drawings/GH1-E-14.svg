<text x="30" y="184" font-size="1.94">I/O modules on the coupler backplane (slots 1-7) · OpenPLC remote device PLANT: DI fc 2 (32), IR fc 4 (16), coils fc 15 (24), HR fc 16 (3), cycle 50 ms, read groups 'set to zero' on comms loss.</text>
<text x="30" y="198.4" font-size="2.81" font-weight="bold">Addresses</text>
