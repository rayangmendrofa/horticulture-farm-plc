<text x="153" y="222.66" font-size="2.05">-A1 time, remote support</text>
<line x1="30" y1="224" x2="210" y2="224" stroke="#000" stroke-width="0.12"/>
<rect x="30" y="200" width="180" height="24" fill="none" stroke="#000" stroke-width="0.3"/>
<line x1="60" y1="200" x2="60" y2="224" stroke="#000" stroke-width="0.12"/>
<line x1="90" y1="200" x2="90" y2="224" stroke="#000" stroke-width="0.12"/>
<line x1="152" y1="200" x2="152" y2="224" stroke="#000" stroke-width="0.12"/>
<text x="220" y="200" font-size="2.59" font-weight="bold">Notes</text>
<text x="220" y="204" font-size="2.05">1.</text>
<text x="223.4" y="204" font-size="2.05">Modbus TCP has no authentication: the control VLAN is isolated, the router allows no inbound traffic to :502 and remote access goes through the VPN only (IEC 62443 zone</text>
<text x="223.4" y="206.7" font-size="2.05">'control').</text>
<text x="220" y="210.2" font-size="2.05">2.</text>
<text x="223.4" y="210.2" font-size="2.05">Loss of the coupler link: OpenPLC zeroes the PLANT inputs, the program trips with A00; the coupler's own watchdog drops its outputs after 1 s (FDS §13).</text>
