<text x="300" y="112" font-size="2.59" font-weight="bold">Notes</text>
<text x="300" y="116" font-size="2.11">1.</text>
<text x="303.4" y="116" font-size="2.11">Coils -K201, -K531, -K541 are switched by the PLC outputs from the safety rail 24V-S (E-08): an</text>
<text x="303.4" y="118.77" font-size="2.11">E-stop removes 24V-S and the motors stop, stop category 0.</text>
<text x="300" y="122.34" font-size="2.11">2.</text>
<text x="303.4" y="122.34" font-size="2.11">Running feedback = MPCB aux 13-14 in series with contactor aux 13-14 (E-07): a tripped MPCB</text>
<text x="303.4" y="125.11" font-size="2.11">also removes the feedback, so the PLC raises the discrepancy alarm (A04, A43, A45).</text>
<text x="300" y="128.68" font-size="2.11">3.</text>
<text x="303.4" y="128.68" font-size="2.11">P-541 (70 bar fog pump): the inlet pressure switch PSL-541 is in the -K541 coil circuit (E-08),</text>
<text x="303.4" y="131.45" font-size="2.11">so the pump stops itself when the clean-water supply fails.</text>
<text x="300" y="135.01" font-size="2.11">4.</text>
<text x="303.4" y="135.01" font-size="2.11">-K201 and -K541 21-22 are in the safety relay's EDM loop (E-06): a welded contactor blocks the</text>
<text x="303.4" y="137.78" font-size="2.11">reset.</text>
<text x="300" y="141.35" font-size="2.11">5.</text>
<text x="303.4" y="141.35" font-size="2.11">Check motor direction at first start (I/O checkout).</text>

<text x="296" y="112" font-size="2.59" font-weight="bold">Notes</text>
<text x="296" y="116" font-size="2.11">1.</text>
<text x="299.4" y="116" font-size="2.11">Dosing pumps are 230 V diaphragm pumps with their own electronics: -K311...-K313 switch the</text>
<text x="299.4" y="118.77" font-size="2.11">supply (enable), the speed follows the 4-20 mA reference from -A1.7.</text>
<text x="296" y="122.34" font-size="2.11">2.</text>
<text x="299.4" y="122.34" font-size="2.11">The pump's run relay closes while it is running and healthy; it is the PLC's running feedback</text>
<text x="299.4" y="125.11" font-size="2.11">(P311_FB...P313_FB, E-07). A pump fault or MCB trip gives A14...A16.</text>
<text x="296" y="128.68" font-size="2.11">3.</text>
<text x="299.4" y="128.68" font-size="2.11">The coils of -K311...-K313 are on 24V-S (E-08): an E-stop stops all dosing.</text>
<text x="296" y="132.25" font-size="2.11">4.</text>
<text x="299.4" y="132.25" font-size="2.11">P-313 doses 10 % nitric acid: PVDF wetted parts, drip tray, acid-resistant cable glands.</text>

<text x="22" y="182" font-size="2.59" font-weight="bold">Notes</text>
<text x="22" y="186" font-size="2.21">1.</text>
<text x="25.4" y="186" font-size="2.21">Stop category 0 (IEC 60204-1 §9.2.2): -K0 removes 24V-S, so every contactor coil and solenoid valve on 24V-S de-energises directly, whatever the PLC outputs are: pumps, fans and</text>
<text x="25.4" y="188.91" font-size="2.21">drives stop, valves close by spring.</text>
<text x="22" y="192.62" font-size="2.21">2.</text>
<text x="25.4" y="192.62" font-size="2.21">-S0.1 (door) and -S0.2 (fertigation skid) are in series in both channels; each has 2 NC contacts with positive opening (IEC 60947-5-5), latching, red mushroom on yellow ground.</text>
<text x="22" y="196.33" font-size="2.21">3.</text>
<text x="25.4" y="196.33" font-size="2.21">-S0R (blue): monitored manual reset, effective on release, only with the EDM loop closed.</text>
<text x="22" y="200.04" font-size="2.21">4.</text>
<text x="25.4" y="200.04" font-size="2.21">-K0 33-34 signals ESTOP_OK to the PLC (/E-07.3): monitoring only. After a reset the PLC still needs RESET (A00) and START: no automatic restart.</text>

<text x="223.4" y="204" font-size="2.05">Modbus TCP has no authentication: the control VLAN is isolated, the router allows no inbound traffic to :502 and remote access goes through the VPN only (IEC 62443 zone</text>
